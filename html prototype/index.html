<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreemWorld — HTML прототип</title>
  <style>
    :root {
      --bg-1: #0a0e27;
      --bg-2: #1a0f3c;
      --neon-blue: #00d4ff;
      --neon-violet: #a855f7;
      --neon-pink: #ec4899;
      --text: #ffffff;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 40%, #1b1240 0%, var(--bg-1) 45%, #05070f 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 70% 20%, #fff 50%, transparent 50%),
        radial-gradient(2px 2px at 40% 70%, #cbd5f5 50%, transparent 50%),
        radial-gradient(1px 1px at 85% 65%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 15% 80%, #93c5fd 50%, transparent 50%);
      opacity: 0.7;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      padding: 48px 40px;
      max-width: 520px;
      text-align: center;
      background: rgba(15, 20, 60, 0.85);
      border: 1px solid rgba(100, 150, 255, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
    }

    .orb {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fde047, #f97316 60%, #b45309);
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.65);
      animation: pulse 4s ease-in-out infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-violet), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 212, 255, 0.5);
      color: var(--neon-blue);
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .links {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--text);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(100, 150, 255, 0.35);
      font-size: 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    a.primary {
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-violet));
      border: none;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.35);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(251, 191, 36, 0.55); }
      50% { transform: scale(1.06); box-shadow: 0 0 70px rgba(251, 191, 36, 0.85); }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <main class="card">
    <div class="orb"></div>
    <h1>DreemWorld</h1>
    <p class="subtitle">Галактика возможностей — HTML-прототип</p>
    <span class="badge">Prototype</span>
    <div class="links">
      <a class="primary" href="../DreemWorld/">Открыть приложение</a>
      <a href="https://github.com/MaksimEpifanov/DreemWorld">Репозиторий</a>
    </div>
  </main>
</body>
</html>
